name: Pages

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer one replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The download buttons link to the latest release's zips, so the site takes its version.
      - name: Fill in the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          version=${tag#v}
          echo "Latest release: $tag"
          find site -name '*.html' -exec sed -i "s/{{version}}/$version/g" {} +
          if grep -rl '{{version}}' site; then
            echo "::error::A version placeholder was left in the site"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
