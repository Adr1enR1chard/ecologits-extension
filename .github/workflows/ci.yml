name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  e2e:
    name: Layout (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test:e2e

  build:
    name: Build (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build & zip
        run: pnpm wxt zip -b ${{ matrix.browser }}

      # The fixture recording hooks hand conversations to the page: development builds only.
      - name: Check no development hook ships
        run: |
          unpacked=$(mktemp -d)
          unzip -q .output/*-${{ matrix.browser }}.zip -d "$unpacked"
          if grep -rlE '__ecologitsOnStream|__ecologitsStreams|stream recorded' "$unpacked"; then
            echo "::error::The production build holds a development hook"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ecologits-extension-${{ matrix.browser }}
          path: .output/*-${{ matrix.browser }}.zip
          if-no-files-found: error
          include-hidden-files: true
